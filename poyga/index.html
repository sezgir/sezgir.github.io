<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Chaqmoq · 3D mashina poygasi</title>
<meta name="description" content="Chaqmoq: botlar bilan 3D mashina poygasi. Telefon va kompyuterda o'ynang.">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#1b1430">
<link rel="icon" href="../favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@500;600;700;800&family=Unbounded:wght@700;900&display=swap">
<script>/* inside Telegram (Mini App) only */
if (/tgWebApp/.test(location.hash) || window.TelegramWebviewProxy || (() => { try { return !!sessionStorage.getItem("__telegram__initParams"); } catch { return false; } })()) document.write('<script src="https://telegram.org/js/telegram-web-app.js"><\/script>');</script>
<style>
:root{
  --ink:#fff; --ink2:rgba(255,255,255,.72); --glass:rgba(18,14,36,.46); --glass2:rgba(18,14,36,.72);
  --line:rgba(255,255,255,.16); --acc:#ffb547; --acc2:#ff5f6d; --teal:#3fe0c5; --blue:#5aa9ff;
  --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#1b1430;color:var(--ink);font-family:Rubik,system-ui,sans-serif;
  -webkit-user-select:none;user-select:none;touch-action:none;overscroll-behavior:none}
canvas#c{position:fixed;inset:0;width:100%;height:100%;display:block}
#speedfx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;opacity:0;transition:opacity .25s}
.ui{position:fixed;inset:0;pointer-events:none}
.ui>*{pointer-events:auto}
.hide{display:none!important}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}

/* ---------- menu ---------- */
#menu{display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:calc(18px + var(--sat)) 16px calc(18px + var(--sab));
  background:linear-gradient(180deg,rgba(20,12,40,.55) 0%,rgba(20,12,40,0) 28%,rgba(20,12,40,0) 52%,rgba(20,12,40,.78) 100%)}
.topbar{width:100%;max-width:560px;display:flex;justify-content:space-between;align-items:center}
.pill{display:inline-flex;align-items:center;gap:6px;padding:9px 14px;border-radius:999px;background:var(--glass);border:1px solid var(--line);
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);font-weight:600;font-size:14px;color:var(--ink);text-decoration:none}
.logo{text-align:center;margin-top:4vh}
.logo h1{margin:0;font-family:Unbounded,Rubik,sans-serif;font-weight:900;font-size:clamp(46px,13vw,92px);letter-spacing:.02em;line-height:1;
  background:linear-gradient(180deg,#fff 0%,#ffe2a8 45%,#ff9a3c 100%);-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 6px 0 rgba(120,40,10,.55)) drop-shadow(0 14px 24px rgba(0,0,0,.45));transform:skewX(-8deg)}
.logo p{margin:10px 0 0;font-weight:600;color:var(--ink2);letter-spacing:.2em;text-transform:uppercase;font-size:12px}
.panel{width:100%;max-width:560px;background:var(--glass2);border:1px solid var(--line);border-radius:24px;padding:16px;
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:0 20px 60px rgba(0,0,0,.35)}
.lbl{font-size:12px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--ink2);margin:2px 4px 10px}
.cars{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:14px}
.car{border-radius:16px;padding:10px 4px 8px;background:rgba(255,255,255,.06);border:2px solid transparent;text-align:center;transition:transform .15s}
.car:active{transform:scale(.96)}
.car.on{border-color:var(--acc);background:rgba(255,181,71,.14)}
.car i{display:block;width:34px;height:34px;margin:0 auto 6px;border-radius:50%;box-shadow:inset 0 -6px 10px rgba(0,0,0,.35),inset 0 5px 8px rgba(255,255,255,.45),0 4px 10px rgba(0,0,0,.3)}
.car span{font-size:11.5px;font-weight:600;line-height:1.15;display:block}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;background:rgba(255,255,255,.06);padding:5px;border-radius:14px;margin-bottom:14px}
.seg button{padding:10px 0;border-radius:10px;font-weight:600;font-size:14px;color:var(--ink2)}
.seg button.on{background:#fff;color:#1b1430}
.go{width:100%;padding:17px;border-radius:18px;font-family:Unbounded,Rubik,sans-serif;font-weight:700;font-size:19px;letter-spacing:.06em;color:#2a1300;
  background:linear-gradient(180deg,#ffd27a,#ff9f2e);box-shadow:0 6px 0 #b3540c,0 14px 28px rgba(255,140,40,.35);transition:transform .1s,box-shadow .1s}
.go:active{transform:translateY(4px);box-shadow:0 2px 0 #b3540c,0 8px 18px rgba(255,140,40,.3)}
.best{margin-top:10px;text-align:center;font-size:13px;color:var(--ink2);min-height:1em}
.howto{margin-top:8px;text-align:center;font-size:12px;color:rgba(255,255,255,.55)}

/* ---------- hud ---------- */
#hud{pointer-events:none}
#hud .tl{position:absolute;left:12px;top:calc(12px + var(--sat));display:flex;gap:8px;align-items:stretch}
.box{background:rgba(18,14,36,.55);border:1px solid var(--line);border-radius:16px;padding:6px 12px;text-align:center;min-width:64px}
.box small{display:block;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink2);font-weight:600}
.box b{font-family:Unbounded,Rubik,sans-serif;font-size:24px;font-weight:700;line-height:1.15}
.box b sup{font-size:12px;opacity:.7;vertical-align:top;margin-left:1px}
#pos b{font-size:30px;color:var(--acc)}
#timeBox b{font-size:17px;font-variant-numeric:tabular-nums}
#mini{position:absolute;right:12px;top:calc(12px + var(--sat));width:118px;height:118px;border-radius:18px;background:rgba(18,14,36,.55);border:1px solid var(--line)}
#pauseBtn{position:absolute;right:138px;top:calc(12px + var(--sat));width:42px;height:42px;border-radius:14px;pointer-events:auto;font-size:18px;font-weight:800}
#gauge{position:absolute;left:50%;bottom:calc(14px + var(--sab));transform:translateX(-50%);width:170px;height:104px}
#gauge canvas{width:170px;height:104px}
#spd{position:absolute;left:0;right:0;bottom:12px;text-align:center;font-family:Unbounded,Rubik,sans-serif;font-weight:700;font-size:30px;font-variant-numeric:tabular-nums;text-shadow:0 2px 10px rgba(0,0,0,.5)}
#spd small{display:block;font-family:Rubik;font-size:10px;letter-spacing:.16em;color:var(--ink2);margin-top:-2px}
#wrong{position:absolute;left:50%;top:28%;transform:translateX(-50%);font-family:Unbounded;font-weight:700;font-size:22px;color:#ff6b6b;text-shadow:0 3px 14px rgba(0,0,0,.6)}
#toast{position:absolute;left:50%;top:22%;transform:translateX(-50%) scale(.6);opacity:0;font-family:Unbounded,Rubik;font-weight:900;font-size:30px;white-space:nowrap;
  color:#fff;text-shadow:0 4px 0 rgba(0,0,0,.25),0 8px 24px rgba(0,0,0,.5);transition:transform .25s cubic-bezier(.2,1.6,.4,1),opacity .25s}
#toast.show{opacity:1;transform:translateX(-50%) scale(1)}
#count{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:Unbounded,Rubik;font-weight:900;font-size:min(34vw,200px);color:#fff;
  text-shadow:0 8px 0 rgba(140,50,0,.45),0 18px 50px rgba(0,0,0,.5)}
#count span{display:block;animation:pop .9s cubic-bezier(.2,1.5,.4,1) both}
#count span.gogo{color:#ffd166;font-size:.42em}
@keyframes pop{0%{transform:scale(2.4);opacity:0}25%{transform:scale(1);opacity:1}80%{transform:scale(.92);opacity:1}100%{transform:scale(.7);opacity:0}}

/* ---------- touch controls ---------- */
#touch{position:fixed;left:0;right:0;bottom:0;height:46%;pointer-events:none}
.tz{position:absolute;bottom:calc(16px + var(--sab));width:86px;height:86px;border-radius:50%;background:rgba(255,255,255,.12);border:2px solid rgba(255,255,255,.28);
  display:flex;align-items:center;justify-content:center;transition:transform .08s,background .08s;pointer-events:none}
.tz svg{width:38px;height:38px;fill:#fff}
.tz.on{background:rgba(255,255,255,.32);transform:scale(.93)}
#tzL{left:16px}#tzR{right:16px}
#brakeBtn{position:absolute;left:22px;bottom:calc(118px + var(--sab));width:74px;height:74px;border-radius:50%;pointer-events:auto;background:rgba(255,80,90,.22);border:2px solid rgba(255,120,130,.5);
  display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:700;font-size:10.5px;letter-spacing:.06em;color:#fff}
#brakeBtn svg{width:24px;height:24px;fill:#fff;margin-bottom:1px}
#brakeBtn.on{background:rgba(255,80,90,.55);transform:scale(.93)}
#nitroBtn{position:absolute;right:20px;bottom:calc(118px + var(--sab));width:82px;height:82px;border-radius:50%;pointer-events:auto;
  background:radial-gradient(circle at 50% 35%,#7ff3ff,#1a8cff 60%,#0b4fb0);box-shadow:0 6px 0 #073a82,0 0 0 4px rgba(255,255,255,.18),0 10px 30px rgba(40,140,255,.45);
  display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:Unbounded;font-weight:700;font-size:12px;letter-spacing:.06em;overflow:hidden}
#nitroBtn svg{width:34px;height:34px;fill:#fff;margin-bottom:2px}
#nitroBtn .fill{position:absolute;left:0;right:0;bottom:0;background:rgba(255,255,255,.22);height:0%}
#nitroBtn.empty{filter:grayscale(.85) brightness(.75)}
#nitroBtn.on{transform:translateY(4px);box-shadow:0 2px 0 #073a82,0 0 0 4px rgba(255,255,255,.3),0 0 40px rgba(80,200,255,.9)}
#nitroBar{position:absolute;left:50%;bottom:calc(122px + var(--sab));transform:translateX(-50%);width:150px;height:8px;border-radius:9px;background:rgba(255,255,255,.18);overflow:hidden}
#nitroBar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#4fd1ff,#a6f7ff);box-shadow:0 0 12px #6ad8ff}
.kbd #touch{display:none}

/* ---------- result / pause ---------- */
.sheet{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:16px;background:rgba(14,9,30,.5);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px)}
.card{width:100%;max-width:440px;background:var(--glass2);border:1px solid var(--line);border-radius:26px;padding:20px 18px 18px;box-shadow:0 30px 80px rgba(0,0,0,.45);
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);animation:rise .45s cubic-bezier(.2,1.3,.4,1) both}
@keyframes rise{from{transform:translateY(40px) scale(.95);opacity:0}}
.place{text-align:center;font-family:Unbounded;font-weight:900;font-size:64px;line-height:1;margin:4px 0 2px;
  background:linear-gradient(180deg,#fff,#ffc76b);-webkit-background-clip:text;background-clip:text;color:transparent}
.place.p2{background-image:linear-gradient(180deg,#fff,#c9d6e8)}.place.p3{background-image:linear-gradient(180deg,#fff,#e6a271)}.place.px{background-image:linear-gradient(180deg,#fff,#9aa)}
.sub{text-align:center;color:var(--ink2);font-weight:600;margin-bottom:14px}
.rows{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.row{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:14px;background:rgba(255,255,255,.06);font-weight:600;font-size:14.5px}
.row.me{background:rgba(255,181,71,.18);outline:1px solid rgba(255,181,71,.5)}
.row .n{width:22px;font-family:Unbounded;font-size:14px;text-align:center}
.row .d{width:12px;height:12px;border-radius:50%}
.row .t{margin-left:auto;font-variant-numeric:tabular-nums;color:var(--ink2)}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px}
.stats div{background:rgba(255,255,255,.06);border-radius:14px;padding:9px 12px}
.stats small{display:block;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink2);font-weight:600}
.stats b{font-family:Unbounded;font-size:17px;font-variant-numeric:tabular-nums}
.btns{display:flex;gap:8px}
.btns .go{flex:1;font-size:15px;padding:15px}
.ghost{flex:1;padding:15px;border-radius:18px;background:rgba(255,255,255,.1);border:1px solid var(--line);font-weight:700;font-size:15px}
.newbest{display:block;text-align:center;color:#ffd166;font-weight:700;font-size:13px;margin:-6px 0 12px;letter-spacing:.08em}
#loading{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#1b1430;z-index:9;transition:opacity .5s;font-weight:600;color:var(--ink2);gap:14px}
#loading .bar{width:160px;height:6px;border-radius:9px;background:rgba(255,255,255,.12);overflow:hidden}
#loading .bar i{display:block;height:100%;width:30%;background:var(--acc);animation:ld 1s ease-in-out infinite alternate}
@keyframes ld{to{transform:translateX(230%)}}
@media (max-width:600px){
  #mini{width:92px;height:92px;border-radius:14px}
  #pauseBtn{right:12px;top:calc(112px + var(--sat))}
  .box{padding:5px 9px;min-width:54px}.box b{font-size:20px}#pos b{font-size:26px}#timeBox b{font-size:15px}
  #gauge{bottom:calc(112px + var(--sab));transform:translateX(-50%) scale(.78);transform-origin:bottom center}
  #nitroBar{display:none}
}
@media (max-height:520px) and (orientation:landscape){
  #menu{flex-direction:row;align-items:center;justify-content:center;gap:24px;padding:calc(10px + var(--sat)) 16px calc(10px + var(--sab))}
  #menu .topbar{position:absolute;left:16px;right:16px;top:calc(10px + var(--sat));width:auto;max-width:none}
  .logo{margin:0;flex:1;max-width:340px}.logo h1{font-size:54px}
  .panel{max-width:400px;padding:12px;max-height:calc(100vh - 20px);overflow:auto}
  .cars{margin-bottom:10px}.car{padding:7px 4px 6px}.car i{width:26px;height:26px;margin-bottom:4px}
  .seg{margin-bottom:10px}.seg button{padding:8px 0}.go{padding:13px;font-size:16px}.howto{display:none}
  #mini{width:84px;height:84px}#pauseBtn{right:104px}
  #gauge{transform:translateX(-50%) scale(.68);transform-origin:bottom center;bottom:calc(6px + var(--sab))}
  .tz{width:76px;height:76px;bottom:calc(12px + var(--sab))}#tzL{left:calc(20px + env(safe-area-inset-left,0px))}#tzR{right:calc(20px + env(safe-area-inset-right,0px))}
  #brakeBtn{left:calc(26px + env(safe-area-inset-left,0px));bottom:calc(98px + var(--sab));width:64px;height:64px}
  #nitroBtn{right:calc(24px + env(safe-area-inset-right,0px));bottom:calc(98px + var(--sab));width:70px;height:70px;font-size:10px}
  #nitroBtn svg{width:26px;height:26px}
  .card{max-height:calc(100vh - 24px);overflow:auto;padding:14px}
  #nitroBar{display:none}
}
.panel,.card{touch-action:pan-y}
.menuBtns{display:flex;gap:8px;margin-top:10px}
.menuBtns .ghost{padding:12px;font-size:14px;border-radius:14px}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:12px}
.tiles div{background:rgba(255,255,255,.06);border-radius:14px;padding:9px 6px;text-align:center}
.tiles b{display:block;font-family:Unbounded;font-size:19px}
.tiles small{font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink2);font-weight:600}
.h3{font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--ink2);margin:4px 4px 8px}
.empty{text-align:center;color:var(--ink2);padding:14px;font-size:14px}
.medal{font-size:15px;width:22px;text-align:center}
@media (min-width:900px){#gauge{transform:translateX(-50%) scale(1.15);transform-origin:bottom center}}
</style>
</head>
<body>
<canvas id="c"></canvas>
<canvas id="speedfx"></canvas>

<div id="loading"><div style="font-family:Unbounded;font-weight:900;font-size:34px;color:#fff;transform:skewX(-8deg)">CHAQMOQ</div><div class="bar"><i></i></div></div>

<!-- MENU -->
<div id="menu" class="ui">
  <div class="topbar">
    <a class="pill" href="../" id="backLink">‹ Sezgir</a>
    <button class="pill" id="soundBtn" aria-label="Ovoz">🔊</button>
  </div>
  <div class="logo"><h1>CHAQMOQ</h1><p>3D mashina poygasi · botlar bilan</p></div>
  <div class="panel">
    <div class="lbl">Mashinangiz</div>
    <div class="cars" id="cars"></div>
    <div class="lbl">Raqiblar</div>
    <div class="seg" id="diff">
      <button data-d="0">Oson</button><button data-d="1" class="on">O'rta</button><button data-d="2">Qiyin</button>
    </div>
    <button class="go" id="startBtn">POYGANI BOSHLASH</button>
    <div class="menuBtns"><button class="ghost" id="statsBtn">🏆 Natijalar</button></div>
    <div class="best" id="bestTxt"></div>
    <div class="howto" id="howto"></div>
  </div>
</div>

<!-- HUD -->
<div id="hud" class="ui hide">
  <div class="tl">
    <div class="box" id="pos"><small>O'rin</small><b>1<sup>/6</sup></b></div>
    <div class="box" id="lapBox"><small>Aylana</small><b>1<sup>/3</sup></b></div>
    <div class="box" id="timeBox"><small>Vaqt</small><b>0:00.0</b></div>
  </div>
  <button class="pill" id="pauseBtn" aria-label="Pauza">II</button>
  <canvas id="mini" width="236" height="236"></canvas>
  <div id="gauge"><canvas id="gc" width="340" height="208"></canvas><div id="spd">0<small>KM/SOAT</small></div></div>
  <div id="nitroBar"><i></i></div>
  <div id="wrong" class="hide">⟲ Teskari yo'nalish</div>
  <div id="toast"></div>
  <div id="count"></div>
</div>

<div id="touch" class="hide">
  <div class="tz" id="tzL"><svg viewBox="0 0 24 24"><path d="M15.5 4.5 8 12l7.5 7.5-1.9 1.9L4.2 12l9.4-9.4z"/></svg></div>
  <div class="tz" id="tzR"><svg viewBox="0 0 24 24"><path d="M8.5 4.5 16 12l-7.5 7.5 1.9 1.9 9.4-9.4-9.4-9.4z"/></svg></div>
  <button id="brakeBtn"><svg viewBox="0 0 24 24"><path d="M6 6h12v12H6z"/></svg>TORMOZ</button>
  <button id="nitroBtn"><div class="fill"></div><svg viewBox="0 0 24 24"><path d="M13 2 4 14h6l-1 8 9-12h-6z"/></svg>NITRO</button>
</div>

<!-- PAUSE -->
<div id="pause" class="sheet hide">
  <div class="card">
    <div class="place" style="font-size:40px">Pauza</div>
    <div class="sub" style="margin-bottom:18px">Poyga to'xtatildi</div>
    <div class="btns" style="flex-direction:column">
      <button class="go" id="resumeBtn">DAVOM ETISH</button>
      <button class="ghost" id="restartBtn">Qaytadan boshlash</button>
      <button class="ghost" id="quitBtn">Menyuga chiqish</button>
    </div>
  </div>
</div>

<!-- STATS -->
<div id="stats" class="sheet hide">
  <div class="card">
    <div class="place" style="font-size:34px;margin-bottom:12px">Natijalar</div>
    <div class="tiles" id="sTiles"></div>
    <div class="h3">Rekordlar</div>
    <div class="rows" id="sBest"></div>
    <div class="h3">Oxirgi poygalar</div>
    <div class="rows" id="sHist"></div>
    <div class="btns"><button class="go" id="sClose">YOPISH</button></div>
  </div>
</div>

<!-- RESULT -->
<div id="result" class="sheet hide">
  <div class="card">
    <div class="place" id="rPlace">1</div>
    <div class="sub" id="rSub">G'olib!</div>
    <span class="newbest hide" id="rBest">★ YANGI REKORD ★</span>
    <div class="stats">
      <div><small>Umumiy vaqt</small><b id="rTime">0:00.0</b></div>
      <div><small>Eng yaxshi aylana</small><b id="rLap">0:00.0</b></div>
    </div>
    <div class="rows" id="rRows"></div>
    <div class="btns">
      <button class="ghost" id="rMenu">Menyu</button>
      <button class="go" id="rAgain">YANA POYGA</button>
    </div>
  </div>
</div>

<script src="../games-stat.js"></script>
<script type="module" src="./game.js"></script>
</body>
</html>
