<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#14171d">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<title>Sezgir panel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script>try { document.documentElement.dataset.theme = localStorage.getItem("sezgir:theme") === "light" ? "light" : "dark"; } catch { document.documentElement.dataset.theme = "dark"; }</script>
<style>
/* Owner-only dashboard. The page is public, the data is not: /admin/stats answers only the owner's fresh Telegram session. */
:root {
  --bg: #f6f7f9; --surface: #ffffff; --ink: #1d2433; --muted: #6b7385; --line: #e4e7ec;
  --accent: #4f7f86; --accent-soft: #e6eff0; --gold: #a9874f; --rest: #b9c0cc;
  --font: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #14171d; --surface: #1b1f27; --ink: #e6e8ec; --muted: #9aa1ae; --line: #2a303b; --accent: #7fb0b6; --accent-soft: #22323a; --gold: #d2ae74; --rest: #4a5262; } }
:root[data-theme="dark"] {
  --bg: #14171d; --surface: #1b1f27; --ink: #e6e8ec; --muted: #9aa1ae; --line: #2a303b; --accent: #7fb0b6; --accent-soft: #22323a; --gold: #d2ae74; --rest: #4a5262; }
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.5 var(--font); -webkit-font-smoothing: antialiased; }
main { max-width: 760px; margin: 0 auto; padding: 20px 16px 48px; display: flex; flex-direction: column; gap: 16px; }
header { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
h1 { font-size: 22px; font-weight: 600; margin: 0; letter-spacing: -.01em; }
h1 span { color: var(--accent); }
.meta { color: var(--muted); font-size: 13px; }
h2 { font-size: 15px; font-weight: 600; margin: 0; }
.sub { color: var(--muted); font-size: 13px; margin: 2px 0 0; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 18px; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.kpis { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
.kpi { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 14px; }
.kpi b { display: block; font-size: 26px; font-weight: 600; font-variant-numeric: tabular-nums; letter-spacing: -.02em; }
.kpi small { color: var(--muted); font-size: 12.5px; line-height: 1.35; display: block; }
svg.chart { width: 100%; height: auto; display: block; overflow: visible; }
svg.chart text { font: 500 20px var(--font); fill: var(--muted); }
svg.chart .bar { cursor: pointer; }
svg.chart .hit:hover + .bar, svg.chart .sel { opacity: .75; }
.tip { min-height: 20px; font-size: 13px; color: var(--ink); font-variant-numeric: tabular-nums; }
.tip:empty::before { content: "Ustunga bosing: aniq son chiqadi"; color: var(--muted); }
.legend { display: flex; gap: 14px; font-size: 12.5px; color: var(--muted); flex-wrap: wrap; }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; }
.hbar { display: grid; grid-template-columns: 70px 1fr 34px; gap: 10px; align-items: center; font-size: 13.5px; }
.hbar .track { height: 10px; background: var(--line); border-radius: 5px; overflow: hidden; }
.hbar .track i { display: block; height: 100%; background: var(--accent); border-radius: 5px; }
.hbar b { text-align: right; font-weight: 600; font-variant-numeric: tabular-nums; }
.tools { display: flex; gap: 8px; flex-wrap: wrap; }
.tools input, .tools select { font: 14px var(--font); color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 9px 12px; min-width: 0; }
.tools input { flex: 1 1 180px; }
.list { display: flex; flex-direction: column; }
.row { display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; padding: 11px 0; border-top: 1px solid var(--line); }
.row:first-child { border-top: 0; }
.row .nm { font-weight: 600; overflow-wrap: anywhere; }
.row .nm em { font-style: normal; font-weight: 500; font-size: 12px; color: var(--accent); background: var(--accent-soft); border-radius: 999px; padding: 1px 8px; margin-left: 6px; }
.row .det { grid-column: 1 / -1; color: var(--muted); font-size: 12.5px; }
.row .num { text-align: right; font-variant-numeric: tabular-nums; font-size: 13px; color: var(--muted); white-space: nowrap; }
.row .num b { color: var(--ink); font-size: 15px; }
.quote { color: var(--ink); font-size: 13.5px; white-space: pre-wrap; grid-column: 1 / -1; }
.empty, .gate { color: var(--muted); }
.gate { text-align: center; padding: 60px 16px; }
.btn { font: 500 14px var(--font); border-radius: 10px; padding: 9px 14px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); cursor: pointer; }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
@media (max-width: 620px) { .two { grid-template-columns: 1fr; } }
.crumbs { display: flex; align-items: center; gap: 8px; min-width: 0; }
.back { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); background: var(--surface); padding: 6px 13px 6px 10px; border-radius: 999px; color: var(--ink); font: 500 14px var(--font); cursor: pointer; text-decoration: none; white-space: nowrap; }
a.row, .row.link { color: inherit; text-decoration: none; cursor: pointer; }
a.row:hover .nm, .row.link:hover .nm { color: var(--accent); }
.gsw { --n: 3; position: relative; display: grid; grid-template-columns: repeat(var(--n), 1fr); border: 1px solid var(--line); border-radius: 12px; padding: 3px; background: var(--bg); margin: -4px 0 2px; }
.gsw i { position: absolute; top: 3px; bottom: 3px; left: 3px; width: calc((100% - 6px) / var(--n)); border-radius: 9px; background: var(--surface); box-shadow: 0 1px 3px rgba(0,0,0,.18); transition: transform .32s cubic-bezier(.3,.8,.3,1); }
.gsw a { position: relative; text-align: center; padding: 8px 6px; font: 500 14px var(--font); color: var(--muted); text-decoration: none; border-radius: 9px; transition: color .2s; }
.gsw a.on { color: var(--ink); }
@keyframes inR { from { opacity: .3; transform: translateX(28px); } } @keyframes inL { from { opacity: .3; transform: translateX(-28px); } }
#app.in-r > :not(header):not(.gsw) { animation: inR .3s ease-out; } #app.in-l > :not(header):not(.gsw) { animation: inL .3s ease-out; }
@media (prefers-reduced-motion: reduce) { .gsw i { transition: none; } #app.in-r > *, #app.in-l > * { animation: none !important; } }
.tabs { display: flex; gap: 6px; flex-wrap: wrap; }
.tab { font: 500 13px var(--font); border: 1px solid var(--line); background: var(--bg); color: var(--muted); padding: 6px 12px; border-radius: 999px; cursor: pointer; text-decoration: none; }
.tab.on { background: var(--accent-soft); color: var(--ink); border-color: var(--accent); }
.tab b { font-weight: 600; margin-left: 4px; }
.res { display: flex; flex-direction: column; }
.res:empty { display: none; }
.grid { width: 100%; border-collapse: collapse; font-size: 13px; font-variant-numeric: tabular-nums; }
.grid th { text-align: right; color: var(--muted); font-weight: 500; padding: 6px 4px; border-bottom: 1px solid var(--line); white-space: nowrap; }
.grid td { text-align: right; padding: 7px 4px; border-bottom: 1px solid var(--line); }
.grid th:first-child, .grid td:first-child { text-align: left; }
.grid td b { font-weight: 600; }
.grid tr.link { cursor: pointer; } .grid tr.link:hover td:first-child { color: var(--accent); }
.scroll { overflow-x: auto; margin: 0 -4px; padding: 0 4px; }
.pill { display: inline-block; font-size: 12px; font-weight: 500; border-radius: 999px; padding: 1px 8px; background: var(--bg); color: var(--muted); border: 1px solid var(--line); }
.pill.ok { color: var(--accent); border-color: var(--accent); background: var(--accent-soft); }
.tip a { color: var(--accent); font-weight: 500; margin-left: 8px; }
.duo { display: grid; grid-template-columns: 1fr auto auto; gap: 2px 12px; font-size: 13px; font-variant-numeric: tabular-nums; margin-top: 6px; grid-column: 1 / -1; }
.duo span { color: var(--muted); } .duo b { text-align: right; font-weight: 600; } .duo b.w { color: var(--accent); }
h1 { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
</style>
</head>
<body>
<main id="app"><p class="gate">Yuklanmoqda…</p></main>
<script>
(() => {
const API = "https://sezgir-api.sezgir-uz.workers.dev";
const MONTHS = ["yan", "fev", "mar", "apr", "may", "iyun", "iyul", "avg", "sen", "okt", "noy", "dek"];
const $app = document.getElementById("app");
const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
const dl = d => { const [, m, dd] = d.split("-").map(Number); return `${dd}-${MONTHS[m - 1]}`; };
const tm = t => { if (!t) return "–"; const d = new Date(t + 5 * 36e5); return `${d.getUTCDate()}-${MONTHS[d.getUTCMonth()]} ${String(d.getUTCHours()).padStart(2, "0")}:${String(d.getUTCMinutes()).padStart(2, "0")}`; };
const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const avg = a => a.length ? Math.round(a.reduce((x, y) => x + y, 0) / a.length) : 0;
const T = window.Telegram && window.Telegram.WebApp; if (T) { try { T.ready(); T.expand(); } catch {} }
let D = null; // indexed data

function gate(msg) { $app.replaceChildren(el("p", "gate", msg)); }
// test names changed over time: Atlas -> Minora (19-noy), Doira -> Ketmon (21-noy)
const testName = (i, date) => i === 2 && date < "2026-11-19" ? "Atlas" : i === 3 && date < "2026-11-21" ? "Doira" : D.tests[i];

function index(r) {
  const users = new Map(r.users.map(u => [u.chat_id, u])), byClient = new Map(r.users.filter(u => u.client).map(u => [u.client, u]));
  const groups = new Map(r.groups.map(g => [g.chat_id, { ...g, members: [] }])), elo = new Map(r.elo.map(e => [e.chat_id, e])), fb = new Map(r.feedback.map(f => [f.chat_id, f]));
  const players = new Map(); // key: chat_id for Telegram users, "c:"+client for site-only players
  const P = key => players.get(key) || (players.set(key, { key, plays: [], groups: [], duels: [] }), players.get(key));
  for (const u of r.users) { const p = P(String(u.chat_id)); p.user = u; p.name = u.name || "O'yinchi"; }
  for (const x of r.plays) { x.scores = JSON.parse(x.scores); const u = byClient.get(x.client); const p = P(u ? String(u.chat_id) : "c:" + x.client); if (!p.user) p.name = `Saytdan · ${x.client.slice(0, 5)}`; p.plays.push(x); x.p = p; }
  for (const m of r.members) { const g = groups.get(m.group_id), p = players.get(String(m.user_id)); if (g && p) { g.members.push(p); p.groups.push(g); } }
  for (const d of r.duels) { d.as = JSON.parse(d.a_scores || "null"); d.bs = JSON.parse(d.b_scores || "null"); d.A = P(String(d.a)); d.B = P(String(d.b)); d.G = groups.get(d.gid); d.A.duels.push(d); d.B.duels.push(d); }
  for (const p of players.values()) { const u = p.user; p.elo = u && elo.get(u.chat_id); p.fb = u && fb.get(u.chat_id); p.n = p.plays.length; p.avg = avg(p.plays.map(x => x.total)); p.best = p.n ? Math.max(...p.plays.map(x => x.total)) : 0;
    p.first = p.n ? p.plays[0].date : null; p.last = p.n ? p.plays[p.n - 1].date : null; p.today = p.plays.find(x => x.date === r.day)?.total ?? null; }
  const days = new Map(); for (const x of r.plays) { const d = days.get(x.date) || (days.set(x.date, { date: x.date, plays: [], fresh: 0, vis: 0, duels: 0 }), days.get(x.date)); d.plays.push(x); if (x.p.first === x.date) d.fresh++; }
  for (const v of r.visits) { const d = days.get(v.date); if (d) d.vis = v.n; else days.set(v.date, { date: v.date, plays: [], fresh: 0, vis: v.n, duels: 0 }); }
  for (const x of r.duels) { const d = days.get(x.day); if (d) d.duels++; }
  const games = {}; // other games: per game, its rows plus per-player totals (names from Sezgir players when the device is known)
  for (const id of Object.keys(GAME_INFO)) games[id] = { id, rows: [], who: new Map() };
  for (const x of r.games || []) { const g = games[x.game]; if (!g) continue; g.rows.push(x); const u = byClient.get(x.client), key = u ? String(u.chat_id) : "c:" + x.client;
    const sp = players.get(key), w = g.who.get(key) || (g.who.set(key, { key, p: sp || null, name: sp ? sp.name : `Saytdan · ${x.client.slice(0, 5)}`, starts: 0, finishes: 0, wins: 0, best: null, days: new Set(), last: x.date }), g.who.get(key));
    w.starts += x.starts; w.finishes += x.finishes; w.wins += x.wins; w.days.add(x.date); w.last = x.date; if (x.best != null) w.best = w.best == null ? x.best : GAME_INFO[x.game].low ? Math.min(w.best, x.best) : Math.max(w.best, x.best); }
  return { ...r, users, players, groups, games, days: [...days.values()].sort((a, b) => a.date < b.date ? -1 : 1) };
}

// vertical bars; series = [{key, label, color}] stacked bottom-up; hover or tap a bar to read it; onPick adds a link to its own page
function bars(rows, series, label, tipOf, opts = {}) {
  const W = 640, H = opts.h || 200, padB = 34, padT = 8, n = Math.max(1, rows.length), gap = n > 20 ? 2 : 4, bw = Math.max(2, (W - gap * (n - 1)) / n);
  const max = Math.max(1, ...rows.map(r => series.reduce((a, s) => a + (r[s.key] || 0), 0)));
  const ns = "http://www.w3.org/2000/svg", svg = document.createElementNS(ns, "svg"); svg.setAttribute("viewBox", `0 0 ${W} ${H}`); svg.setAttribute("class", "chart"); svg.setAttribute("role", "img"); svg.setAttribute("aria-label", opts.aria || "");
  const mk = (t, a) => { const e = document.createElementNS(ns, t); for (const k in a) e.setAttribute(k, a[k]); return e; };
  svg.append(mk("line", { x1: 0, x2: W, y1: H - padB + .5, y2: H - padB + .5, stroke: css("--line") }));
  const tip = el("div", "tip"); let sel = null;
  const show = (r, g) => { if (sel) sel.classList.remove("sel"); sel = g; g.classList.add("sel"); tip.replaceChildren(tipOf(r)); if (opts.onPick) { const a = el("a", null, "batafsil →"); a.href = opts.onPick(r); tip.append(a); } };
  rows.forEach((r, i) => { const x = i * (bw + gap); let y = H - padB; const g = mk("g", {});
    series.forEach((s, k) => { const v = r[s.key] || 0; if (!v) return; const h = Math.max(2, (H - padB - padT) * v / max); y -= h; const top = series.slice(k + 1).every(t => !(r[t.key] || 0));
      g.append(mk("rect", { x, y, width: bw, height: Math.max(1, h - (k ? 2 : 0)), rx: top ? Math.min(4, bw / 2) : 0, fill: s.color, class: "bar" })); });
    const hit = mk("rect", { x: x - gap / 2, y: 0, width: bw + gap, height: H, fill: "transparent", style: "cursor:pointer" });
    hit.addEventListener("click", () => show(r, g)); hit.addEventListener("mouseenter", () => show(r, g));
    svg.append(g, hit);
    const lb = label(r, i); if (lb) { const t = mk("text", { x: x + bw / 2, y: H - 8, "text-anchor": "middle" }); t.textContent = lb; svg.append(t); } });
  const wrap = el("div"); wrap.append(svg, tip);
  if (series.length > 1) { const lg = el("div", "legend"); series.forEach(s => { const sp = el("span"); const i = el("i"); i.style.background = s.color; sp.append(i, s.label); lg.append(sp); }); wrap.prepend(lg); }
  return wrap;
}
function hbars(items) { const box = el("div"); box.style.cssText = "display:flex;flex-direction:column;gap:9px"; items.forEach(([n, v]) => { const r = el("div", "hbar"); const tr = el("div", "track"); const f = el("i"); f.style.width = Math.max(0, Math.min(100, v)) + "%"; tr.append(f); r.append(el("span", null, n), tr, el("b", null, String(v))); box.append(r); }); return box; }
function card(title, sub, ...kids) { const c = el("section", "card"); const h = el("div"); h.append(el("h2", null, title)); if (sub) h.append(el("p", "sub", sub)); c.append(h, ...kids.filter(Boolean)); return c; }
function kpis(list) { const kp = el("div", "kpis"); list.forEach(([v, k, s, href]) => { const b = el(href ? "a" : "div", "kpi"); if (href) { b.href = href; b.style.cssText = "color:inherit;text-decoration:none"; } b.append(el("b", null, String(v)), el("small", null, k)); if (s) b.append(el("small", null, s)); kp.append(b); }); return kp; }
function link(href, cls) { const a = el("a", cls || "row"); a.href = href; return a; }
const pHref = p => `#p/${encodeURIComponent(p.key)}`;
const lbl = (rows, key) => (r, i) => (i === rows.length - 1 || i % Math.ceil(rows.length / 6) === 0) ? dl(r[key]) : "";

function head(title, back) {
  const h = el("header"); const left = el("div", "crumbs");
  if (back) { const b = el("a", "back", "‹ Orqaga"); b.href = "#"; b.onclick = e => { e.preventDefault(); history.length > 1 ? history.back() : (location.hash = ""); }; left.append(b); }
  const h1 = el("h1"); if (back) h1.textContent = title; else h1.innerHTML = "Sez<span>gir</span> · panel"; left.append(h1);
  const right = el("div"); right.style.cssText = "display:flex;gap:10px;align-items:center"; const rf = el("button", "btn", "Yangilash"); rf.onclick = load; right.append(el("span", "meta", dl(D.day)), rf); h.append(left, right); return h;
}
function playerRow(p, extra) { const r = link(pHref(p)); const nm = el("div", "nm", p.name); if (p.today != null) nm.append(el("em", null, `bugun ${p.today}`));
  const num = el("div", "num"); num.append(el("b", null, p.n ? `${p.n} kun` : "o'ynamagan"), document.createTextNode(p.n ? ` · o'rt. ${p.avg} · eng ${p.best}` : ""));
  const det = [p.n ? (p.first === p.last ? dl(p.first) : `${dl(p.first)} → ${dl(p.last)}`) : "", p.groups.map(g => g.title).join(", ") || (p.user ? "guruhsiz" : "Telegramsiz"), p.elo ? `duel ${p.elo.elo}` : "", p.fb?.stars ? `${p.fb.stars}★` : "", p.user && !p.user.active ? "eslatma o'chiq" : "", extra || ""].filter(Boolean).join(" · ");
  r.append(nm, num, el("div", "det", det)); return r; }
const STATUS = { done: "tugagan", pending: "javob kutilmoqda", active: "o'ynalmoqda", expired: "muddati o'tgan", declined: "rad etilgan" };
function duelRow(x) { const r = el("div", "row"); const nm = el("div", "nm"); const a = el("a", null, x.A.name), b = el("a", null, x.B.name); a.href = pHref(x.A); b.href = pHref(x.B); a.style.color = b.style.color = "inherit"; nm.append(a, " ⚔️ ", b);
  const num = el("div", "num"); num.append(x.status === "done" ? el("b", null, `${x.a_score} : ${x.b_score}`) : el("span", "pill" + (x.status === "active" ? " ok" : ""), STATUS[x.status] || x.status));
  const side = (s, sc, st) => sc != null ? `${s} o'ynadi (${sc})` : st ? `${s} boshladi, tugatmadi` : `${s} hali o'ynamadi`;
  const det = [`chaqirildi ${tm(x.created)}`, x.accepted ? `qabul ${tm(x.accepted)}` : "", x.G ? x.G.title : "", x.status === "done" && x.delta ? `${x.a_score > x.b_score ? x.A.name : x.b_score > x.a_score ? x.B.name : "durang"} ±${Math.abs(x.delta)}` : "",
    x.status === "active" ? `${side(x.A.name, x.a_score, x.a_start)}; ${side(x.B.name, x.b_score, x.b_start)}` : ""].filter(Boolean).join(" · ");
  r.append(nm, num, el("div", "det", det));
  if (x.as && x.bs) { const g = el("div", "duo"); g.append(el("span"), el("span", null, x.A.name.slice(0, 10)), el("span", null, x.B.name.slice(0, 10))); x.as.forEach((v, i) => { const w = x.bs[i]; g.append(el("span", null, testName(i, x.day)), el("b", v > w ? "w" : null, String(v)), el("b", w > v ? "w" : null, String(w))); }); r.append(g); }
  return r; }

// ---------- other games (Chaqmoq, Pistirma) ----------
const GAME_INFO = { chaqmoq: { name: "🏎 Chaqmoq", low: true, fin: "marraga yetdi", best: "eng tez", fmt: v => `${Math.floor(v / 60)}:${(v % 60).toFixed(2).padStart(5, "0")}` }, pistirma: { name: "🎯 Pistirma", low: false, fin: "o'yinni tugatdi", best: "eng ko'p ochko", fmt: v => String(Math.round(v)) } };
// game slider (Sezgir | Chaqmoq | Pistirma): a sliding thumb like the public stats page; swipe left/right on the page also switches
const SW = () => [["", "Sezgir"], ...Object.entries(GAME_INFO).map(([id, I]) => ["game/" + id, I.name.replace(/^\S+ /, "")])];
let swLast = 0, swDir = 0;
function gameSwitch(cur) { const list = SW(), idx = Math.max(0, list.findIndex(([h]) => h === cur)), box = el("div", "gsw"), th = el("i");
  box.style.setProperty("--n", list.length); th.style.transform = `translateX(${swLast * 100}%)`; box.append(th);

  Object.entries(F).forEach(([k, [l, fn]]) => { const t = el("button", "tab" + (k === f ? " on" : "")); t.append(l, el("b", null, String(D.duels.filter(fn).length))); t.onclick = () => { f = k; [...tabs.children].forEach(c => c.classList.toggle("on", c === t)); paint(); }; tabs.append(t); });
  const paint = () => { const s = q.value.trim().toLowerCase(); const rows = D.duels.filter(F[f][1]).filter(x => !s || x.A.name.toLowerCase().includes(s) || x.B.name.toLowerCase().includes(s)); list.replaceChildren(...rows.map(duelRow)); if (!rows.length) list.append(el("p", "empty", "Bunday duel yo'q.")); };
  q.oninput = paint; paint();
  $app.replaceChildren(head("Duellar", true), card(`Duellar (${D.duels.length})`, "kim kimni chaqirgan, kim o'ynab bo'lgan, natija va testlar", tabs, tools, list));
}
function ratingsPage() { const l = el("div", "list"); D.feedback.slice().sort((a, b) => (b.commented || b.rated || 0) - (a.commented || a.rated || 0)).forEach(f => { const p = D.players.get(String(f.chat_id)); const r = p ? link(pHref(p)) : el("div", "row"); const num = el("div", "num"); num.append(el("b", null, f.stars ? "★".repeat(f.stars) + "☆".repeat(5 - f.stars) : "javob yo'q"));
    r.append(el("div", "nm", `${f.name || p?.name || "O'yinchi"}${f.username ? " · @" + f.username : ""}`), num, el("div", "det", f.stars ? tm(f.commented || f.rated) : `so'raldi ${tm(f.asked)}`)); if (f.comment) r.append(el("div", "quote", f.comment)); l.append(r); });
  const rated = D.feedback.filter(f => f.stars); const dist = [5, 4, 3, 2, 1].map(n => [`${n}★`, rated.length ? Math.round(rated.filter(f => f.stars === n).length / rated.length * 100) : 0]);
  $app.replaceChildren(head("Baholar", true), kpis([[rated.length ? (rated.reduce((a, f) => a + f.stars, 0) / rated.length).toFixed(1) + "★" : "–", "o'rtacha", ""], [rated.length, "baholadi", `so'ralgan ${D.feedback.length}`], [D.feedback.filter(f => f.comment).length, "izoh yozdi", ""]]),
    card("Taqsimot", "foizda", hbars(dist)), card("Barcha baholar", null, l)); }

function route() { if (!D) return; const h = decodeURIComponent(location.hash.slice(1)); window.scrollTo(0, 0);
  if (h === "players") playersPage(); else if (h.startsWith("p/")) playerPage(h.slice(2)); else if (h.startsWith("d/")) dayPage(h.slice(2)); else if (h === "groups") groupsPage(); else if (h.startsWith("g/")) groupPage(h.slice(2)); else if (h === "duels") duelsPage(); else if (h === "ratings") ratingsPage(); else if (h.startsWith("game/")) gamePage(h.slice(5)); else home(); if ($app.querySelector(".gsw")) slideIn(); }
window.addEventListener("hashchange", route);

async function load() {
  if (!T || !T.initData) { gate("Bu panel faqat Telegram ichida, Sezgir muallifi uchun ochiladi."); return; }
  try { const r = await fetch(API + "/admin/stats", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ initData: T.initData }) });
    if (r.status === 403) { gate("Bu panel faqat Sezgir muallifi uchun."); return; }
    if (!r.ok) throw 0; D = index(await r.json()); route(); }
  catch (e) { console.error(e); gate("Ma'lumot yuklanmadi. Internetni tekshirib, qayta oching."); }
}
load();
})();
</script>
