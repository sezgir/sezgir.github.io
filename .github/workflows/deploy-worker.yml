# Deploys the bot/stats server (Cloudflare Worker "sezgir-api") whenever worker/ changes on main.
# Needs the repository secret CLOUDFLARE_API_TOKEN (Cloudflare token from the "Edit Cloudflare Workers" template).
# Secrets set in the Cloudflare dashboard (TG_BOT_TOKEN, TG_WEBHOOK_SECRET, ...) are kept by `wrangler deploy`.
name: Deploy worker
on:
  push:
    branches: [main]
    paths: ["worker/**"]
  workflow_dispatch:
concurrency: deploy-worker
jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Deploy
        run: npx --yes wrangler@3 deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 728c8a7421d5b2a618456449b726f402
