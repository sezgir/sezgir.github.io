<style>
:root { --bg:#0b0e13; --glass:rgba(18,22,30,.72); --line:rgba(255,255,255,.09); --ink:#eef1f6; --muted:#98a1b0; --amber:#ffb547; --amber2:#ff8a3d; --teal:#46d6c8; --red:#ff5b6b; }
* { box-sizing:border-box; }
html, body { margin:0; height:100%; background:var(--bg); color:var(--ink); font-family:Inter,system-ui,sans-serif; overflow:hidden; touch-action:none; -webkit-user-select:none; user-select:none; -webkit-tap-highlight-color:transparent; overscroll-behavior:none; }
#c { position:fixed; inset:0; width:100%; height:100%; display:block; }

[hidden] { display:none !important; }

/* ---------- menu ---------- */
#menu { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; padding:calc(16px + env(safe-area-inset-top)) 16px calc(16px + env(safe-area-inset-bottom)); background:radial-gradient(120% 80% at 50% 0%, rgba(11,14,19,.15), rgba(11,14,19,.75)); overflow-y:auto; touch-action:pan-y; }
.panel { width:100%; max-width:480px; background:var(--glass); border:1px solid var(--line); border-radius:22px; padding:22px 20px 20px; backdrop-filter:blur(14px) saturate(1.2); -webkit-backdrop-filter:blur(14px) saturate(1.2); box-shadow:0 30px 80px rgba(0,0,0,.55), inset 0 1px 0 rgba(255,255,255,.06); margin:auto; }
.top-row { display:flex; justify-content:space-between; align-items:center; margin-bottom:10px; }
.back { display:inline-flex; gap:6px; align-items:center; color:var(--muted); text-decoration:none; font-size:14px; font-weight:500; padding:6px 12px 6px 8px; border:1px solid var(--line); border-radius:999px; }
.back:hover { color:var(--ink); }
.ib { width:36px; height:36px; border-radius:50%; border:1px solid var(--line); background:rgba(255,255,255,.04); display:grid; place-items:center; }
.logo { display:flex; align-items:center; gap:14px; margin:6px 0 4px; }
.logo img { width:64px; height:64px; filter:drop-shadow(0 8px 18px rgba(255,140,50,.35)); }
.logo h1 { margin:0; font-size:38px; font-weight:800; letter-spacing:.06em; line-height:1; background:linear-gradient(180deg,#ffe3b0 0%,#ffb547 45%,#ff7a3d 100%); -webkit-background-clip:text; background-clip:text; color:transparent; filter:drop-shadow(0 4px 14px rgba(255,150,60,.35)); }
.logo p { margin:6px 0 0; color:var(--muted); font-size:14px; }
.lbl { font-size:12px; font-weight:600; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); margin:18px 0 8px; }
.maps { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; }
.map { border:1px solid var(--line); background:rgba(255,255,255,.03); border-radius:14px; padding:6px 6px 8px; text-align:left; transition:transform .15s, border-color .15s, box-shadow .15s; }
.map canvas { width:100%; aspect-ratio:34/24; border-radius:9px; display:block; background:#07090c; }
.map b { display:block; font-size:13px; font-weight:600; margin:7px 2px 0; }
.map small { display:block; font-size:11px; color:var(--muted); margin:1px 2px 0; }
.map.sel { border-color:var(--amber); box-shadow:0 0 0 1px var(--amber), 0 10px 26px rgba(255,160,60,.22); }

.seg { display:flex; gap:4px; background:rgba(0,0,0,.25); border:1px solid var(--line); border-radius:12px; padding:4px; }
.seg button { flex:1; border:0; background:transparent; padding:9px 0; border-radius:9px; font-size:14px; font-weight:500; color:var(--muted); }

.weps { display:flex; justify-content:space-between; gap:6px; margin-top:4px; }

/* ---------- HUD ---------- */

#feed { position:absolute; left:50%; transform:translateX(-50%); top:calc(60px + env(safe-area-inset-top)); display:flex; flex-direction:column; gap:4px; align-items:center; }
#feed div { font-size:12.5px; background:rgba(10,12,16,.55); padding:4px 10px; border-radius:8px; color:var(--muted); transition:opacity .6s; white-space:nowrap; }

#streak { position:absolute; left:0; right:0; top:30%; text-align:center; pointer-events:none; }
#streak .s1 { font-size:13px; font-weight:600; letter-spacing:.08em; color:#fff; opacity:.85; text-transform:uppercase; }

#streak .s2 { font-size:44px; font-weight:800; letter-spacing:.04em; line-height:1.05; background:linear-gradient(180deg,#fff2d6,#ffb547 55%,#ff7a3d); -webkit-background-clip:text; background-clip:text; color:transparent; filter:drop-shadow(0 6px 20px rgba(255,130,50,.45)); }
#streak.pop { animation:pop 1.6s cubic-bezier(.2,.9,.3,1.2) forwards; }

.hp { width:180px; padding:9px 12px; display:flex; flex-direction:column; justify-content:center; gap:6px; }

.hp.low .bar i { background:linear-gradient(90deg,#ff4d5e,#ff9a7a); }
.hp span { font-size:12px; color:var(--muted); display:flex; justify-content:space-between; }
.hp span b { color:var(--ink); }
.wcard { display:flex; gap:10px; align-items:center; padding:6px 12px 6px 8px; }
.wcard img { width:76px; height:32px; object-fit:contain; }
.wcard b { display:block; font-size:12px; color:var(--muted); font-weight:500; }
.wcard span { font-size:18px; font-weight:700; font-variant-numeric:tabular-nums; }
.wcard span small { font-size:12px; color:var(--muted); font-weight:500; }
.wcard .rl { height:3px; background:var(--amber); border-radius:2px; width:0; margin-top:3px; }
.tbtn { pointer-events:auto; position:absolute; width:58px; height:58px; border-radius:50%; border:1px solid rgba(255,255,255,.14); background:radial-gradient(circle at 35% 30%, rgba(255,255,255,.16), rgba(20,24,32,.75)); color:#fff; font-size:13px; font-weight:600; display:grid; place-items:center; backdrop-filter:blur(6px); -webkit-backdrop-filter:blur(6px); box-shadow:0 6px 16px rgba(0,0,0,.35); }
#bReload { right:calc(18px + env(safe-area-inset-right)); bottom:calc(190px + env(safe-area-inset-bottom)); }
#bPick { right:calc(86px + env(safe-area-inset-right)); bottom:calc(214px + env(safe-area-inset-bottom)); width:auto; padding:0 18px; height:44px; border-radius:999px; background:linear-gradient(180deg,#ffd28a,#ff9f45); color:#2a1503; border:0; font-size:14px; }
#pickTip { position:absolute; left:50%; transform:translateX(-50%); bottom:calc(84px + env(safe-area-inset-bottom)); font-size:13px; padding:7px 12px; }
#pickTip kbd { font:600 12px Inter; border:1px solid var(--line); border-radius:5px; padding:1px 6px; margin-right:6px; background:rgba(255,255,255,.08); }
#dead { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:6px; background:radial-gradient(circle, rgba(60,0,10,.15), rgba(30,0,6,.55)); }
#dead b { font-size:30px; font-weight:800; letter-spacing:.05em; }
#dead span { color:var(--muted); font-size:14px; }
#dead em { font-style:normal; font-size:15px; color:var(--amber); font-weight:600; margin-top:6px; }
body.touch #bottom { left:50%; transform:translateX(-50%); bottom:calc(10px + env(safe-area-inset-bottom)); }
body.touch .hp { width:128px; }
body.touch .wcard img { width:56px; }
body:not(.touch) .tbtn { display:none !important; }
body.touch #pickTip { display:none !important; }
@media (max-width:520px) { #board { font-size:11.5px; min-width:112px; } #streak .s2 { font-size:34px; } .logo h1 { font-size:32px; } }

/* ---------- overlays ---------- */
.over { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; padding:16px; background:rgba(6,8,11,.55); backdrop-filter:blur(6px); -webkit-backdrop-filter:blur(6px); }
.over h2 { margin:0 0 4px; font-size:26px; font-weight:800; letter-spacing:.03em; }
.over .sub { color:var(--muted); margin:0 0 16px; font-size:14px; }
.btns { display:flex; gap:10px; margin-top:16px; }
.btns button { flex:1; border-radius:14px; padding:13px; font-weight:600; border:1px solid var(--line); background:rgba(255,255,255,.05); }
.btns button.pri { border:0; color:#2a1503; font-weight:800; background:linear-gradient(180deg,#ffd28a,#ffb547 45%,#ff8f3d); box-shadow:0 4px 0 #b5561d; }
.rank { width:100%; border-collapse:collapse; font-size:14px; }
.rank td { padding:8px 6px; border-top:1px solid var(--line); }
.rank td:first-child { width:28px; color:var(--muted); }
.rank td.n { text-align:right; font-variant-numeric:tabular-nums; color:var(--muted); }
.rank tr.me td { color:var(--ink); background:rgba(255,181,71,.08); }
.rank tr.me td:first-child { color:var(--amber); }
.rank i { display:inline-block; width:9px; height:9px; border-radius:50%; margin-right:8px; }
.big { display:flex; gap:10px; margin-bottom:14px; }
.big div { flex:1; background:rgba(255,255,255,.04); border:1px solid var(--line); border-radius:14px; padding:10px 12px; }
.big b { display:block; font-size:26px; font-weight:800; font-variant-numeric:tabular-nums; }
.big small { color:var(--muted); font-size:12px; }
.big .new { color:var(--amber); }
</style>

<script>
(() => {
"use strict";
const T = 64, VR = 1000;
const $ = s => document.querySelector(s);
const rand = (a, b) => a + Math.random() * (b - a);
const pick = a => a[Math.floor(Math.random() * a.length)];
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const angDiff = (a, b) => { let d = b - a; while (d > Math.PI) d -= Math.PI * 2; while (d < -Math.PI) d += Math.PI * 2; return d; };
const store = { get(k, d) { try { const v = localStorage.getItem("pistirma:" + k); return v == null ? d : JSON.parse(v); } catch { return d; } }, set(k, v) { try { localStorage.setItem("pistirma:" + k, JSON.stringify(v)); } catch {} } };
const TOUCH = matchMedia("(pointer: coarse)").matches || navigator.maxTouchPoints > 0 && !matchMedia("(pointer: fine)").matches;
if (TOUCH) document.body.classList.add("touch");

const cv = $("#c"), g = cv.getContext("2d");
const fog = document.createElement("canvas"), fg = fog.getContext("2d");
let W = 0, H = 0, DPR = 1;
function resize() { DPR = Math.min(window.devicePixelRatio || 1, 2); W = innerWidth; H = innerHeight; cv.width = fog.width = Math.round(W * DPR); cv.height = fog.height = Math.round(H * DPR); }
addEventListener("resize", resize); resize();
function mk(w, h) { const c = document.createElement("canvas"); c.width = w; c.height = h; return c; }
function shade(hex, f) { const n = parseInt(hex.slice(1), 16); let r = n >> 16, gg = n >> 8 & 255, b = n & 255; const t = f < 0 ? 0 : 255, p = Math.abs(f); r = Math.round((t - r) * p + r); gg = Math.round((t - gg) * p + gg); b = Math.round((t - b) * p + b); return `rgb(${r},${gg},${b})`; }
function rgba(hex, a) { const n = parseInt(hex.slice(1), 16); return `rgba(${n >> 16},${n >> 8 & 255},${n & 255},${a})`; }
function rr(x, a, b, w, h, r) { x.beginPath(); x.moveTo(a + r, b); x.arcTo(a + w, b, a + w, b + h, r); x.arcTo(a + w, b + h, a, b + h, r); x.arcTo(a, b + h, a, b, r); x.arcTo(a, b, a + w, b, r); x.closePath(); }

// ---------- weapons ----------
const WEAPONS = {
  pistol:  { name: "To'pponcha", dmg: 24, rate: .26, spread: .035, speed: 1500, mag: 12, reload: 1.0, range: 950, pellets: 1, shake: 2, len: 20, ammo: Infinity, move: 1, rank: 0, dist: 380 },
  smg:     { name: "Avtomat", dmg: 15, rate: .095, spread: .075, speed: 1700, mag: 30, reload: 1.6, range: 950, pellets: 1, shake: 2.2, len: 32, ammo: 90, move: .96, rank: 2, dist: 360 },
  shotgun: { name: "Drobovik", dmg: 13, rate: .78, spread: .26, speed: 1300, mag: 6, reload: 1.8, range: 520, pellets: 8, shake: 7, len: 30, ammo: 24, move: .93, rank: 2, dist: 190 },
  sniper:  { name: "Mergan", dmg: 100, rate: 1.15, spread: .004, speed: 3400, mag: 5, reload: 2.2, range: 1700, pellets: 1, shake: 9, len: 42, ammo: 15, move: .86, rank: 3, dist: 620 },
};
const WKEYS = ["smg", "shotgun", "sniper"];
// gun art: drawn once with gradients, pointing +x, grip at origin
function metal(x, y0, y1, c = ["#eef2f8", "#8d96a6", "#3a404d"]) { const l = x.createLinearGradient(0, y0, 0, y1); l.addColorStop(0, c[0]); l.addColorStop(.5, c[1]); l.addColorStop(1, c[2]); return l; }
const WOOD = ["#e7a868", "#b06a32", "#6a3a17"], DARK = ["#6b7383", "#2e333d", "#14171c"];
function drawGun(x, k) {
  const part = (fn, grad) => { x.fillStyle = grad; fn(); x.fill(); x.strokeStyle = "rgba(0,0,0,.55)"; x.lineWidth = .8; x.stroke(); };
  x.lineJoin = "round";
  if (k === "pistol") {
    part(() => { x.beginPath(); x.moveTo(-2, 2); x.lineTo(7, 2); x.lineTo(5, 11); x.lineTo(-3, 11); x.closePath(); }, metal(x, 2, 11, DARK));
    part(() => rr(x, -4, -5, 26, 8, 2.5), metal(x, -5, 3));
    x.fillStyle = "rgba(255,255,255,.55)"; x.fillRect(-2, -4.2, 22, 1.3);
  } else if (k === "smg") {
    part(() => rr(x, -20, -3.5, 16, 7, 2), metal(x, -3.5, 3.5, DARK));
    part(() => { x.beginPath(); x.moveTo(8, 4); x.lineTo(15, 4); x.lineTo(17, 15); x.lineTo(11, 16); x.closePath(); }, metal(x, 4, 16, DARK));
    part(() => rr(x, -6, -6, 32, 11, 2.5), metal(x, -6, 5));
    part(() => rr(x, 25, -3, 16, 5, 1.5), metal(x, -3, 2, DARK));
    x.fillStyle = "#46d6c8"; x.fillRect(4, -8, 6, 2.5);
    x.fillStyle = "rgba(255,255,255,.55)"; x.fillRect(-4, -5, 28, 1.3);
  } else if (k === "shotgun") {
    part(() => { x.beginPath(); x.moveTo(-22, -4); x.lineTo(-2, -5); x.lineTo(-2, 5); x.lineTo(-22, 7); x.closePath(); }, metal(x, -5, 7, WOOD));
    part(() => rr(x, -3, -5.5, 22, 10, 2), metal(x, -5.5, 4.5));
    part(() => rr(x, 18, -4.5, 26, 5, 2), metal(x, -4.5, .5, DARK));
    part(() => rr(x, 22, .5, 14, 5, 2), metal(x, .5, 5.5, WOOD));
    x.fillStyle = "rgba(255,255,255,.5)"; x.fillRect(0, -4.6, 17, 1.2);
  } else {
    part(() => { x.beginPath(); x.moveTo(-26, -4); x.lineTo(-3, -5); x.lineTo(-3, 5); x.lineTo(-24, 8); x.closePath(); }, metal(x, -5, 8, WOOD));
